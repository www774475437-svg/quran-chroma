name: بناء التطبيق والموقع

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: نسخ صفحة التطبيق إلى الأندرويد
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html
      - name: بناء APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: تجهيز الملف
        run: cp android/app/build/outputs/apk/release/app-release.apk quran-chroma.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quran-chroma-apk
          path: quran-chroma.apk
      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: القرآن كروما 1.0.${{ github.run_number }}
          body: تطبيق القرآن كروما — تطوير أبو عبد الرحمن أحمد الأثري
          files: quran-chroma.apk
          make_latest: true

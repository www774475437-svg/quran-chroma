plugins {
    id 'com.android.application'
}

def buildNum = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'com.fawaid.quranchroma'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fawaid.quranchroma'
        minSdk 24
        targetSdk 34
        versionCode buildNum
        versionName "1.0." + buildNum
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'qchroma2026'
            keyAlias 'quranchroma'
            keyPassword 'qchroma2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
